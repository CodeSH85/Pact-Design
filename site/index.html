<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pact Design · Design System</title>
    <meta
      name="description"
      content="Domain-neutral design token system engineered for dense, compact, and straightforward user interfaces."
    />
    <script>
      (() => {
        const saved = localStorage.getItem('pact-theme')
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const theme = saved === 'dark' || saved === 'light' ? saved : preferred
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body class="h-full w-full overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
